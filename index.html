<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Calculator</title>
  <style>
    :root {
      color-scheme: dark;
      --text: #fff1f1;
      --muted: #e7a5a8;
    }

    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      display: grid;
      place-items: center;
      background: #000;
      color: var(--text);
      font: 16px "Segoe UI", sans-serif;
    }

    .calculator {
      width: min(100%, 390px);
      padding: 20px;
      border: 1px solid #ffffff55;
      border-radius: 22px;
      background: linear-gradient(145deg, #ffffff20, #6a1f282d 50%, #ffffff0b);
      box-shadow: 0 24px 70px #000, inset 0 1px #ffffff66;
      backdrop-filter: blur(28px) saturate(175%);
    }

    .top { display: flex; justify-content: flex-end; margin-bottom: 12px; }
    button {
      min-width: 0;
      height: 58px;
      border: 1px solid #ffffff66;
      border-radius: 15px;
      background: linear-gradient(145deg, #ffffff30, #ff364b20 55%, #790c182e);
      box-shadow: 0 6px 14px #0006, inset 0 1px #ffffff88;
      backdrop-filter: blur(22px) saturate(185%);
      color: var(--text);
      font: 600 19px "Segoe UI", sans-serif;
      cursor: pointer;
    }
    button:hover { filter: brightness(1.2); }
    button:focus-visible { outline: 2px solid white; outline-offset: 2px; }

    .theme {
      height: auto;
      padding: 9px 14px;
      border-radius: 999px;
      background: #ffffff20;
      font-size: 13px;
    }
    .display {
      min-height: 145px;
      padding: 22px 8px 18px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-end;
      overflow: hidden;
      border-bottom: 1px solid #ffffff33;
    }
    .expression {
      min-height: 22px;
      max-width: 100%;
      overflow: hidden;
      color: var(--muted);
      font-size: 14px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .result {
      max-width: 100%;
      overflow: hidden;
      font: 56px/1.15 Georgia, serif;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .error { color: #ffd2d3; font: 20px "Segoe UI", sans-serif; }
    .keys {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 9px;
      padding-top: 16px;
    }
    .utility { background: linear-gradient(145deg, #ffffff3b, #ff364b20 60%, #790c1833); font-size: 15px; }
    .operator { background: linear-gradient(145deg, #ffffff2b, #ff273544 55%, #a5001838); }
    .equals {
      grid-column: 1 / -1;
      background: linear-gradient(110deg, #ff3546dd, #ad0718dd);
      font-size: 23px;
    }

    body.light {
      color-scheme: light;
      --text: #411318;
      --muted: #99545b;
      background: #f4eeee;
    }
    .light .calculator { background: linear-gradient(145deg, #ffffffd9, #f0dadaaa); }
    .light button { color: #54141a; background: linear-gradient(145deg, #ffffffdd, #f3ddddbb); }
    .light .equals { color: white; background: linear-gradient(110deg, #e12634, #a70a17); }

    @media (max-width: 420px) {
      .calculator { padding: 16px; }
      .display { min-height: 125px; }
      button { height: 54px; }
      .theme { height: auto; }
    }
  </style>
</head>
<body class="{{theme_class}}">
  <main class="calculator" aria-label="Calculator">
    <form method="post">
      <input type="hidden" name="expression" value="{{expression}}">
      <input type="hidden" name="completed_expression" value="{{completed_expression}}">
      <input type="hidden" name="done" value="{{done}}">
      <input type="hidden" name="theme" value="{{theme}}">

      <header class="top">
        <button class="theme" name="action" value="toggle-theme">{{theme_label}}</button>
      </header>
      <section class="display" aria-label="Calculator display" aria-live="polite">
        <div class="expression">{{shown_expression}}</div>
        <div class="result {{result_class}}" role="status">{{result}}</div>
      </section>
      <section class="keys" aria-label="Calculator keys">
        <button class="utility" name="key" value="all-clear">AC</button>
        <button class="utility" name="key" value="clear">C</button>
        <button class="utility" name="key" value="%">%</button>
        <button class="utility" name="key" value="backspace" aria-label="Backspace">⌫</button>
        <button name="key" value="7">7</button><button name="key" value="8">8</button>
        <button name="key" value="9">9</button><button class="operator" name="key" value="/">÷</button>
        <button name="key" value="4">4</button><button name="key" value="5">5</button>
        <button name="key" value="6">6</button><button class="operator" name="key" value="*">×</button>
        <button name="key" value="1">1</button><button name="key" value="2">2</button>
        <button name="key" value="3">3</button><button class="operator" name="key" value="-">−</button>
        <button class="utility" name="key" value="sign">±</button>
        <button name="key" value="0">0</button><button name="key" value="decimal">.</button>
        <button class="operator" name="key" value="+">+</button>
        <button class="equals" name="key" value="equals">=</button>
      </section>
    </form>
  </main>
</body>
</html>
